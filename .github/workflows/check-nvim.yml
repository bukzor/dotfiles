# modified from telescope.nvim:
#   https://github.com/nvim-telescope/telescope.nvim/blob/master/.github/workflows/ci.yml
name: Check Neovim

on: [push, pull_request]

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        rev: [stable, nightly, v0.9.5, v0.10.0]
        exclude:
          - os: windows-2022  # nvim 0.9.5 segfaults on Windows loading this config
            rev: v0.9.5
          # macOS runners schedule slowly here (one job at a time): stable only
          - {os: macos-latest, rev: nightly}
          - {os: macos-latest, rev: v0.9.5}
          - {os: macos-latest, rev: v0.10.0}
        include:
          - os: ubuntu-22.04
            install-rg: sudo apt-get update && sudo apt-get install -y ripgrep

          - os: macos-latest
            install-rg: brew install ripgrep


    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.rev }}

      - name: Install dependencies
        run: ${{ matrix.install-rg }}

      - name: Run config tests
        shell: bash
        run: ./bin/vim-config-test nvim
