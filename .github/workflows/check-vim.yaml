# modified from telescope.nvim:
#   https://github.com/nvim-telescope/telescope.nvim/blob/master/.github/workflows/ci.yml
name: Check Vim

on: [push, pull_request]

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # supported: Vim >= 8.2.3995 (oldest current Ubuntu LTS), Linux and
        # macOS; no Windows -- see
        # docs/dev/adr/2026-11-22-000-vim-and-nvim-support-floor.md
        os: [ubuntu-22.04, macos-latest]
        rev:
          - stable  # on ubuntu-22.04: apt's 8.2.3995, the supported floor
          - nightly
        exclude:
          # macOS runners schedule slowly here (one job at a time): stable only
          - {os: macos-latest, rev: nightly}
        include:
          - os: ubuntu-22.04
            install-rg: sudo apt-get update && sudo apt-get install -y ripgrep

          - os: macos-latest
            install-rg: brew install ripgrep

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: false
          version: ${{ matrix.rev }}

      - name: Install dependencies
        run: ${{ matrix.install-rg }}

      - name: Run config tests
        shell: bash
        run: ./bin/vim-config-test vim
