#see: http://mutelight.org/articles/practical-tmux

set -g status-style fg=white,bold,bg=colour92
# TODO: set statusbar color based on hash of #{session_name} #(whoami) #(hostname -f)
#display-message "#(echo "$((16#$(echo "$(whoami)@$(hostname -f)" | openssl dgst -r | head -c2)))")"

# Surface failed scheduled jobs continuously: this polls every
# status-interval (default 15s below), so it reaches panes that outlive
# .config/sh/rc.d/cron-status.sh's once-at-shell-start check -- which is all
# of them, in practice, since tmux panes here run for days. See
# docs/dev/adr/2026-09-10-001-tmux-status-bar-cron-alerting.md.
set -g status-right "#(~/bin/cron-status --tmux)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"

# give me more history
set-option -g history-limit 100000
set-option -g display-time 1500  # 750ms is too little time to read anything

# Be more like screen(1): use CTRL+A prefix
set-option -g prefix C-a
bind-key C-a last-window
bind-key a send-prefix

#be more mouse-user-friendly
set -g mouse
# slow down mouse-wheel scrolling (down from default -N 5)
bind-key -T copy-mode    WheelUpPane          select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode    WheelDownPane        select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode-vi WheelUpPane          select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane        select-pane \; send-keys -X -N 1 scroll-down

# allow osc52 to work
set -g set-clipboard on
# allow nvim 'autoread' to work
set-option -g focus-events on

#be more vi-user-friendly
set-option -g status-keys vi
set-window-option -g mode-keys vi
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r C-h select-pane -L
bind-key -r C-j select-pane -D
bind-key -r C-k select-pane -U
bind-key -r C-l select-pane -R

#Windows-esque bindings
bind-key C-c copy-mode
bind-key C-v paste-buffer -p

# C-u is the vim-esque page-up. (emacs too?)
bind-key C-u copy-mode -u

# support block-visual mode:
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

# esc clears an active selection first; exits copy-mode on the next press
bind-key -T copy-mode-vi Escape {
  if -F "#{selection_present}" {
    send -X clear-selection
  } {
    send -X cancel
  }
}

# Avoid cancelling copy-mode if the pane history has been scrolled.
bind-key -T copy-mode-vi MouseDragEnd1Pane {
  if -F "#{scroll_position}" {
    send -X copy-pipe
  } {
    send -X copy-pipe-and-cancel
  }
}

# Make vim respond to esc quickly
set-option -sg escape-time 0

# Give me some room on the left, but still enable five shortcuts (C-A,6) to the right.
set -g base-index 5

# Helps when i connect to a session from multiple places
setw -g aggressive-resize on

# Enable 256 color support, for vim, etc.
# xterm-kitty needs a matching terminfo entry; deferred until the versioned
# ~/.terminfo build lands (see ~/.claude/todo.md), so default to the safer
# xterm-256color for now.
###set-option -g default-terminal xterm-kitty  # faster and less bugs than screen
set-option -g default-terminal xterm-256color  # faster and less bugs than screen
set-option -ga terminal-overrides ",*kitty:Tc"
set-option -ga terminal-overrides ",xterm-kitty:Tc"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -ga terminal-overrides ",*-direct:Tc"

# help ssh-agent tunnel into tmux'd shells: $SSH_AUTH_SOCK
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY"

# Some things don't really need a prefix key
unbind-key -n C-Left
unbind-key -n C-Right
bind-key -n M-h previous-window
bind-key -n M-l next-window
bind-key -n M-j select-pane -U
bind-key -n M-k select-pane -D

# let me hold Ctrl key down for these common keystrokes
# (C-l/C-n/C-p handwritten; the rest generated via:
#       tmux list-keys | grep -v -- ' [CM]-' | sed 's/   */ C-/'
bind-key C-Space send-prefix
bind-key C-? list-keys
bind-key C-D choose-client
bind-key C-L switch-client -l
bind-key C-[ copy-mode
bind-key C-] paste-buffer -p
bind-key C-d detach-client
bind-key C-f command-prompt "find-window '%%'"
bind-key C-i display-message
bind-key -r C-l last-window
bind-key -r C-n next-window
bind-key C-o select-pane -t :.+
bind-key -r C-p previous-window
bind-key C-q display-panes
bind-key C-r refresh-client
bind-key C-s choose-session
bind-key C-t clock-mode
bind-key C-w choose-window
bind-key C-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key C-PPage copy-mode -u
bind-key -r C-Up select-pane -U
bind-key -r C-Down select-pane -D
unbind-key C-Left
unbind-key C-Right

# Clearing the name means "let the program name this window again". tmux's own
# rename-window takes an empty name literally, leaving the window nameless and
# still opted out of automatic-rename; the helper releases the option instead.
bind-key , command-prompt -I '#W' -p '(rename-window)' \
  "run-shell \"$HOME/bin/tmux-rename-window '#{window_id}' '%%'\""

# A window's name should say what work it holds. In precedence order: a name I
# assigned wins (assigning one turns automatic-rename off for that window);
# else the program's own declared title; else an inference from the running
# command, which is tmux's stock behavior and all it could ever offer. A pane
# that has declared no title reports the hostname, so that -- like empty --
# means undeclared. Trimmed from the left, marking the elision: paths and
# conversation titles alike discriminate at their tail, and every window here
# would otherwise be named "bash".
# claude-code prefixes its declared title with an eight-spoked asterisk,
# which reads as one of tmux's own status-bar flags and spends a column on a
# separating space. Swap that prefix for the nerd-font claude mark
# (U+EC82, cod-claude): a twelve-point splat no flag resembles.
set-window-option -g automatic-rename-format '#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host_short}}},#{?pane_in_mode,[tmux],#{pane_current_command}},#{=/-24/…:#{s/✳ //:pane_title}}}#{?pane_dead,[dead],}'

# Programs declare a title with OSC 2, and .config/sh/rc.d/pane-title.sh makes
# the shell declare its directory; the format above is what consumes them.
# This is already tmux's default, but the naming policy depends on it: were it
# on, an OSC 2 would rename the window directly and silently switch
# automatic-rename off -- the opt-out that must mean "a human named this".
set-option -g allow-rename off
