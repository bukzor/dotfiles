# psi-oom-watch catches the reclaim livelock earlyoom is structurally blind to.
# It is a root system unit with the same Restart=always + StartLimitIntervalSec=0
# policy as earlyoom, so it has the same blind spot: the unit never reaches
# "failed", and `systemctl is-active` says "active" straight through a crash
# loop. Watch the process, not the unit.
#
# Nothing else would notice this one dying. It is silent by design -- it only
# logs above `full avg10 >= 5`, plus an hourly heartbeat -- so a dead daemon and
# a healthy machine produce the same empty journal.
# Anchored on the interpreter, not the script: this is a #!/usr/bin/env python3
# script, so its cmdline is "python3 /usr/local/sbin/psi-oom-watch --dry-run"
# and the script path never appears first. Anchoring matters -- an unanchored
# pattern also matches any shell whose command line merely mentions the path,
# which reads as "running" while the daemon is dead.
check process psi-oom-watch matching "^python3 /usr/local/sbin/psi-oom-watch"
  if does not exist then exec "/home/bukzor/.local/share/health/notify psi-oom-watch is not running"
  if uptime < 1 minute for 3 cycles then exec "/home/bukzor/.local/share/health/notify psi-oom-watch is crash-looping"
