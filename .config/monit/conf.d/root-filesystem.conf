# / reached 99% (2.2G free) with nothing noticing, on 2026-08-10. It surfaced
# only by accident: a memory test needed a file larger than RAM and there was no
# room to create one.
#
# A full disk is worth an alarm here specifically because it damages this
# machine's ability to explain its own failures. journald drops records, sysstat
# leaves gaps, and session transcripts truncate -- exactly the evidence the next
# incident investigation runs on, and every one of them degrades silently rather
# than erroring.
#
# Absolute free space, not a percentage: the consequence is absolute. journald
# needs room to rotate whether the volume is 137G or 1T, and a percentage on a
# large filesystem crosses its threshold far too late to act on. 10 GB is about
# a week of headroom at the rate transcripts and journals accumulate here.
check filesystem root-filesystem with path /
  if space free < 10 GB then exec "/home/bukzor/.local/share/health/notify / is low on space"
