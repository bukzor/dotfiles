# LXCFS serves /proc/{meminfo,stat,cpuinfo,...} over FUSE from a daemon in the
# host VM, outside this container. When it dies the mounts go stale and every
# read returns ENOTCONN -- which kills earlyoom, and is invisible until someone
# notices a login-time error hours later.
check program proc-readable with path /home/bukzor/.local/share/health/proc-readable
  if status != 0 then exec "/home/bukzor/.local/share/health/lxcfs-detach"
