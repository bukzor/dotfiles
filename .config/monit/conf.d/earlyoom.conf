# earlyoom is the only OOM guard here: under swapless page-cache thrash the
# kernel OOM killer never fires, so nothing else stops a reclaim livelock.
#
# systemd cannot report its death. Restart=always plus StartLimitIntervalSec=0
# means the unit never reaches "failed" state, so OnFailure= can never trigger;
# a crash-loop just reads as "activating" forever. Watch the process instead.
check process earlyoom matching "^/usr/bin/earlyoom"
  if does not exist then exec "/home/bukzor/.local/share/health/notify earlyoom is not running"
  if uptime < 2 minutes then exec "/home/bukzor/.local/share/health/notify earlyoom is crash-looping"
